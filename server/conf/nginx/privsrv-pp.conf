# 私服 HTTPS 专用入口(带 PROXY protocol) - 由 8080 代理转发, 传递真实公网IP
# 需放在 nginx vhost 目录(如 /www/server/panel/vhost/nginx/privsrv-pp.conf)
server {
    listen 9443 ssl proxy_protocol;
    server_name _;
    ssl_certificate     /opt/privsrv/certs/server.crt;
    ssl_certificate_key /opt/privsrv/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    client_max_body_size 256m;
    access_log /opt/privsrv/logs/nginx-access-pp.log;
    error_log  /opt/privsrv/logs/nginx-error-pp.log;
    location /d/ { alias /opt/privsrv/uploads/; autoindex on; }
    location /GameCreator-byte/ { alias /opt/privsrv/uploads/cover/; }
    location /GameCreatorTest/  { alias /opt/privsrv/uploads/cover/; }
    location /agent {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }
}
