# ============================================================
#  nginx 配置：把 hortor 游戏域名（SNI）分发到私服后端
#
#  放置位置：
#    - 标准 nginx：/etc/nginx/conf.d/privsrv.conf
#    - 宝塔面板：  /www/server/panel/vhost/nginx/privsrv.conf
#                （并在 nginx.conf 的 http{} 里确认有 include 该目录）
#  证书路径按实际安装目录调整（默认 /opt/privsrv/certs/）。
#  改完： nginx -t && nginx -s reload  （宝塔：重载 nginx）
# ============================================================

# ---- 80：明文 ws://.../agent（客户端部分连接走这个）----
server {
    listen 80 default_server;
    server_name _;
    location /agent {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location /uploads {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
    }
}

# ---- 443：TLS，按 SNI 命中 hortor 域名 ----
server {
    listen 443 ssl;
    server_name *.hortorgames.com hortorgames.com
                *.hortorinteractive.com hortorinteractive.com;

    ssl_certificate     /opt/privsrv/certs/server.crt;
    ssl_certificate_key /opt/privsrv/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 256m;

    # 封面/资源（gameEnv.fileCDN 拼出 /GameCreator-byte/ 前缀）
    location /d/ {
        alias /opt/privsrv/uploads/;
        autoindex on;
    }
    location /GameCreator-byte/ { alias /opt/privsrv/uploads/cover/; }
    location /GameCreatorTest/  { alias /opt/privsrv/uploads/cover/; }

    # /agent 长连接（登录后建立的 WebSocket）
    location /agent {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 其余 HTTP 接口走后端
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }
}
